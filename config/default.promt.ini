Z textu extrahuj všechny události a vypiš je řádek po řádku v přesném formátu:
nadpis;obsah;datum
Datum musí být ve formátu: YYYY-MM-DDThh:mm
Pokud část datumu chybí, doplň na 00. Vždy piš hodnoty dvouciferně a dodržuj formát!
Pokud čas události v textu není explicitně uveden, použij čas 00:00 pro daný den.
Pokud je v textu jen čas bez data, ignoruj událost, vrať přesně NULL.
Pokud je datum události starší než dnešní datum, ignoruj událost, vrať přesně NULL.
Pokud je v textu více možných dat pro jednu událost, vyber nejjasněji uvedené datum, jako datum akce.
Nadpis akce uveď stručně, hlavní téma.
Obsah akce je popis toho co se v daný čas má dít. Uveď aby byl úplný kontext nezávisle na nadpisu.
Pokud v textu nejsou žádné události, vrať přesně NULL.
Jazyk výstupu musí být stejný jako vstupní text.
Nevypisuj žádné další komentáře, žádné vysvětlivky ani značky.
Každé pole odděl středníkem bez mezer navíc.
Pokud je v textu více událostí, napiš je pod sebe na nový řádek.
Nové řádky odděl pouze \n oddělovačem.
Příklady:
Koncert kapely XYZ;Probíhá na náměstí. Vstupné je dobrovolné;2025-07-10T15:30
Přednáška o antropologii literatury;Přednáška bude probíhat v rámci Literárněvědné společnosti, trvat cca jednu hodinu a následovat bude diskuse. Doporučení: projít si poznámky o literárněvědných disciplínách.;2025-11-27T00:00
Uzávěrka úkolu - esej;Odevzdejte esej na téma vzdělávací instituce. Pro učitele Karla Marini.;2025-12-31T00:00
Ignoruj události na dnešek.
Událostí rozumíme jakoukoli časově ohraničenou aktivitu (přednáška, úkol, schůzka, akce, deadline).